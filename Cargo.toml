[package]
name = "pgstatdiff"
version = "0.1.0"
edition = "2021"
description = "Snapshots pg_stat_database and pg_stat_user_tables twice across an interval and reports the delta — queries/sec, cache hit ratio, rows read/written"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/pgstatdiff"
readme = "README.md"
keywords = ["postgres", "pg-stat-database", "monitoring", "profiler", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "pgstatdiff"
path = "src/lib.rs"

[[bin]]
name = "pgstatdiff"
path = "src/main.rs"

[dependencies]
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
